[project]
name = "suresdk-py"
version = "0.1.0"
description = "Library for consistent performace and observability"
authors = [{ name = "Ashish Ranjan", email = "ashish@tug.ro" }]
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "confluent-kafka (>=2.8.0,<3.0.0)",
  "flatten-dict (>=0.4.2,<0.5.0)",
  "opentelemetry-distro[otlp] (>=0.50b0,<0.51)",
  "tenacity (>=9.0.0,<10.0.0)",
]


[tool.poetry.group.dev.dependencies]
mypy = "^1.14.1"


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"


[[tool.mypy.overrides]]
ignore_missing_imports = true
module = ["confluent_kafka", "flatten_dict"]
